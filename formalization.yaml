fidelity:
  divergences: The formalized compact-real local conclusions use explicit normalization,
    positivity, actual ordered frames and an admitted full-ledger neighborhood. The
    constructed ambient equivalence is not required to agree with the supplied tangent
    equivalence. Q26/full54 equivalence is only for actual ordered frames; score=2Phi
    is algebraic and free of input-dependent denominators. There is no global exact-two
    fiber theorem, label-permutation quotient, normalized middle-trace contrast, probability
    semantics, or forced Lie-gluing premise. Sources concerning split/complex invariant
    theory are background unless an exact compact adapter is separately proved.
